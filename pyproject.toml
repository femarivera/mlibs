[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mlibs"
version = "0.1.2"
description = "MODFLOW 6 modelling utilities"
authors = [
  { name = "MARIN RIVERA Carlos Felipe" }
]
license = {text = "BSD-3-Clause"} 
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26,<2",
    "scipy>=1.12",
    "matplotlib>=3.9,<3.10",
    "flopy>=3.8",
    "pandas>=2.0,<3",
    "geopandas>=1.0.1",
    "imageio>=2.36",
    "scikit-learn>=1.6",
    "openpyxl>=3.1",
    "shapely>=2.0",
    "pyemu>=1.3",

]

[tool.setuptools.packages.find]
where = ["."]